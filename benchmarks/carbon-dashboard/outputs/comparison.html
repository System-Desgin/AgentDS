<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentDS Carbon dashboard benchmark</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
        background: #201d14;
        color: #f1eada;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: #201d14;
      }

      header {
        display: flex;
        min-height: 64px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px 24px;
        border-bottom: 1px solid #57503f;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 24px;
        font-weight: 600;
      }

      header p {
        color: #d9a054;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        background: #57503f;
      }

      section {
        min-width: 0;
        background: #faf7f2;
      }

      .label {
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
        border-bottom: 1px solid #e3dbc9;
        color: #17150f;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }

      .label strong {
        color: #bc4a26;
        font-weight: 500;
      }

      iframe {
        display: block;
        width: 100%;
        height: 840px;
        border: 0;
        background: #ffffff;
      }

      footer {
        padding: 12px 24px;
        border-top: 1px solid #57503f;
        color: #f1eada;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
      }

      @media (max-width: 900px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Same brief. One added file.</h1>
      <p>codex-cli 0.153.2 · gpt-5.6-sol · medium</p>
    </header>
    <main>
      <section aria-labelledby="baseline-label">
        <div class="label" id="baseline-label">
          <span>no DESIGN.md</span>
          <strong>0 / 7 checks</strong>
        </div>
        <iframe src="baseline.html" title="Dashboard generated without DESIGN.md"></iframe>
      </section>
      <section aria-labelledby="carbon-label">
        <div class="label" id="carbon-label">
          <span>+ Carbon DESIGN.md</span>
          <strong>5 / 7 checks</strong>
        </div>
        <iframe src="carbon.html" title="Dashboard generated with Carbon DESIGN.md"></iframe>
      </section>
    </main>
    <footer>
      exact prompt · generated source · SHA-256 inputs and outputs · machine-readable rubric
    </footer>
  </body>
</html>
